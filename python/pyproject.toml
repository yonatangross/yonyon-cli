[project]
name = "yonyon"
version = "0.1.0"
description = "Official Python client for the public yonyon.ai agent API (generated from https://yonyon.ai/.well-known/openapi.json)."
authors = [{ name = "Yonatan Gross" }]
license = "MIT"
requires-python = ">=3.11"
readme = "README.md"
keywords = ["yonyon", "agent", "api", "sdk", "openapi"]
dependencies = [
    "httpx>=0.23.1,<0.29.0",
    "attrs>=22.2.0",
]

[project.urls]
Homepage = "https://yonyon.ai"
Documentation = "https://yonyon.ai/developers"
Source = "https://github.com/yonatangross/yonyon-cli/tree/main/python"
OpenAPI = "https://yonyon.ai/.well-known/openapi.json"

[tool.uv.build-backend]
module-name = "yonyon"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
